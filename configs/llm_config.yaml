gemini_model: "gemini-2.5-pro"        # stable channel only; retires Oct 2026 (Section 9.3).
                                        # gemini-2.5-pro-preview-06-05 was deprecated 2025-12-02
                                        # and is permanently rejected (Section 13).
gemini_input_token_cap: 1048576        # Section 2.5 / 8.4
gemini_thinking_standard: 13000        # Section 2.5 / 8.4: STANDARD calls (chain+BA+BlueAgent)
gemini_thinking_deep: 32768            # Section 2.5 / 8.4: DEEP calls (ExploitConfirmationAgent)

groq_strategy_model: ""   # MUST SET; run scripts/verify_groq_models.py; no default (Section 3)
groq_report_model: ""     # MUST SET; run scripts/verify_groq_models.py; no default (Section 3)

